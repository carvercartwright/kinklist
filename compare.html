        <script>
            // Colour scheme: this tab's choice, or the remembered one if Remember on this device is on
            (function(){
                var theme = new URLSearchParams(location.search).get('theme');
                try {
                    if(theme) sessionStorage.setItem('kinklist-theme', theme);
                    theme = sessionStorage.getItem('kinklist-theme') || (JSON.parse(localStorage.getItem('kinklist')) || {}).theme;
                }
                catch(e) {}
                if(theme) document.documentElement.dataset.theme = theme;
            })();
        </script>
